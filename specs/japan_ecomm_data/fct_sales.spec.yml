spec_version: 2
source_name: japan_ecomm_data
model_name: fct_sales
layer: marts
materialization: table
description: >
  Fact table containing sales aggregated by date, maker, and item category.
  Grain: one row per (sales_date, maker, item_category) combination.
bootstrap:
  from_sql: models/marts/japan_ecomm_data/fct_sales.sql
  from_schema: models/marts/japan_ecomm_data/schema.yml
upstream:
  - int_enriched_transactions
attributes:
  - id: attr_sales_key
    name: sales_key
    type: string
    role: primary_key
    description: Surrogate primary key — hash of sales_date, maker, and item_category.
    tests:
      - unique
      - not_null
  - id: attr_sales_date
    name: sales_date
    type: date
    role: timestamp
    description: Date the sale occurred (UTC).
    tests:
      - not_null
  - id: attr_maker
    name: maker
    type: string
    role: dimension
    description: The manufacturer or brand of the item sold.
    tests:
      - not_null
  - id: attr_item_category
    name: item_category
    type: string
    role: dimension
    description: Derived product category (Smartphone or Other).
    tests:
      - not_null
      - accepted_values:
          values: ['Smartphone', 'Other']
  - id: attr_total_sales
    name: total_sales
    type: number
    role: metric
    description: Sum of item prices for this grouping.
    tests:
      - not_null
  - id: attr_avg_unit_price
    name: avg_unit_price
    type: number
    role: metric
    description: Average item price for this grouping.
    tests: []
  - id: attr_transaction_count
    name: transaction_count
    type: integer
    role: metric
    description: Number of individual transactions in this grouping.
    tests: []
