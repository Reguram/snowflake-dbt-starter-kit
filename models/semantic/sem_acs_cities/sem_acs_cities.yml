version: 2

models:
  - name: sem_acs_cities
    description: >
      Semantic view for ACS DP05 demographic and housing estimates at US city/place level
      built from fct_acs_cities. Grain: one row per (geo_id, year, variable_code).
      Enables Cortex Analyst natural language querying over city demographics, population,
      race, age distribution, and housing data with geolocation support.
    config:
      meta:
        verified_queries:
          - name: total_population_by_state
            question: "What is the total population estimate by state?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT state, SUM(estimate) AS total_population
              FROM cities
              WHERE label_value = 'Total population'
              GROUP BY state
              ORDER BY total_population DESC

          - name: top_cities_by_estimate
            question: "Which cities have the highest total demographic estimates?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT city_or_place, state, SUM(estimate) AS total_estimate
              FROM cities
              GROUP BY city_or_place, state
              ORDER BY total_estimate DESC
              LIMIT 20

          - name: demographic_breakdown_by_category
            question: "What is the average percent estimate by label category?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT label_category, AVG(percent_estimate) AS avg_pct_estimate
              FROM cities
              GROUP BY label_category
              ORDER BY avg_pct_estimate DESC

          - name: population_trend_by_year
            question: "How has the total population estimate changed by year?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT survey_year, SUM(estimate) AS total_population
              FROM cities
              WHERE label_value = 'Total population'
              GROUP BY survey_year
              ORDER BY survey_year ASC

          - name: cities_by_state_race_breakdown
            question: "What is the racial composition estimate by state?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT state, label_value, SUM(estimate) AS total_estimate
              FROM cities
              WHERE label_category = 'RACE'
              GROUP BY state, label_value
              ORDER BY state, total_estimate DESC
