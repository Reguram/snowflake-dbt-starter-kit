version: 2

models:
  - name: sem_acs_housing_by_county
    description: >
      Semantic view for ACS DP04 selected housing characteristics aggregated by US county.
      Built from summary_acs_housing_by_county. Grain: one row per (geo_id, year, subject, label_category).
      Enables Cortex Analyst to answer questions about housing occupancy, tenure, structure type,
      home values, and rental costs at the county level.
    config:
      meta:
        verified_queries:
          - name: total_housing_estimate_by_state
            question: "What is the total housing estimate by state?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT state, SUM(total_estimate) AS total_housing_estimate
              FROM housing
              GROUP BY state
              ORDER BY total_housing_estimate DESC

          - name: top_counties_by_housing_estimate
            question: "Which counties have the highest total housing estimates?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT state, county, SUM(total_estimate) AS total_housing_estimate
              FROM housing
              GROUP BY state, county
              ORDER BY total_housing_estimate DESC
              LIMIT 15

          - name: housing_subject_breakdown
            question: "What is the total housing estimate by subject area?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT subject, SUM(total_estimate) AS total_estimate
              FROM housing
              GROUP BY subject
              ORDER BY total_estimate DESC

          - name: housing_percent_by_category_year
            question: "What is the average housing percent estimate by category and year?"
            verified_at: 1745712000
            verified_by: author
            sql: >
              SELECT survey_year, label_category, AVG(total_percent_estimate) AS avg_pct
              FROM housing
              GROUP BY survey_year, label_category
              ORDER BY survey_year DESC, avg_pct DESC
