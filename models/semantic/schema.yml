version: 2
models:

- name: sem_jhu_covid19_timeseries
  description: >
    Semantic view for JHU COVID-19 timeseries. Grain: (province_state, county, case_type, month_period).
    DDL: ddl/semantic/sem_jhu_covid19_timeseries_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_JHU_COVID19_TIMESERIES
        description: JHU COVID-19 timeseries — cumulative and incremental case counts by country, state, county, and case type
        dimensions:
        - name: province_state
          description: Province or state name
        - name: county
          description: County name
        - name: case_type
          description: Type of COVID case (Confirmed, Deaths, etc.)
        - name: iso3166_1
          description: ISO 3166-1 country code
        - name: month_period
          description: Month period of the record
        - name: year_period
          description: Year period of the record
        metrics:
        - name: total_cases
          type: sum
          expression: total_cases
          description: Total cumulative COVID cases
        - name: total_new_cases
          type: sum
          expression: total_difference
          description: Total new cases (difference from previous period)

- name: sem_jhu_covid19
  description: >
    Semantic view for JHU COVID-19 summary. Grain: (province_state, county, case_type, month_period).
    DDL: ddl/semantic/sem_jhu_covid19_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_JHU_COVID19
        description: JHU COVID-19 summary — cumulative and incremental case counts by country, state, county, and case type
        dimensions:
        - name: province_state
          description: Province or state name
        - name: county
          description: County name
        - name: case_type
          description: Type of COVID case (Confirmed, Deaths, etc.)
        - name: iso3166_1
          description: ISO 3166-1 country code
        - name: month_period
          description: Month period of the record
        metrics:
        - name: total_cases
          type: sum
          expression: total_cases
          description: Total cumulative COVID cases
        - name: total_new_cases
          type: sum
          expression: total_difference
          description: Total new cases (difference from previous period)

- name: sem_owid_vaccinations
  description: >
    Semantic view for OWID global vaccinations. Grain: (country_region, month_period).
    DDL: ddl/semantic/sem_owid_vaccinations_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_OWID_VACCINATIONS
        description: OWID global COVID-19 vaccination data — doses, people vaccinated, and per-capita rates by country and month
        dimensions:
        - name: country_region
          description: Country or region name
        - name: iso3166_1
          description: ISO 3166-1 country code
        - name: vaccines
          description: Vaccine brands used in the country
        - name: month_period
          description: Month period of the vaccination record
        metrics:
        - name: total_vaccinations
          type: sum
          expression: total_total_vaccinations
          description: Total vaccine doses administered
        - name: total_people_fully_vaccinated
          type: sum
          expression: total_people_fully_vaccinated
          description: Total people fully vaccinated
        - name: avg_fully_vaccinated_per_hundred
          type: avg
          expression: avg_people_fully_vaccinated_per_hundred
          description: Average people fully vaccinated per 100

- name: sem_google_mobility
  description: >
    Semantic view for Google global mobility report. Grain: (province_state, iso_3166_1, sub_region_2, month_period).
    DDL: ddl/semantic/sem_google_mobility_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_GOOGLE_MOBILITY
        description: Google mobility — % change in visits to retail, parks, transit, workplaces, residential by region and month
        dimensions:
        - name: province_state
          description: Province or state name
        - name: iso_3166_1
          description: ISO 3166-1 country code
        - name: sub_region_2
          description: Sub-region level 2 (e.g., county)
        - name: month_period
          description: Month period of the mobility record
        metrics:
        - name: avg_retail_recreation_change
          type: avg
          expression: avg_retail_and_recreation_change_perc
          description: Average % change in retail and recreation visits
        - name: avg_workplaces_change
          type: avg
          expression: avg_workplaces_change_perc
          description: Average % change in workplace visits

- name: sem_ecdc_global
  description: >
    Semantic view for ECDC global COVID-19. Grain: (continentexp, iso3166_1, month_period).
    DDL: ddl/semantic/sem_ecdc_global_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_ECDC_GLOBAL
        description: ECDC global COVID-19 — cumulative and daily cases, deaths, and population by country and continent
        dimensions:
        - name: continentexp
          description: Continent name
        - name: iso3166_1
          description: ISO 3166-1 country code
        - name: month_period
          description: Month period of the record
        metrics:
        - name: total_cases
          type: sum
          expression: total_cases
          description: Total cumulative COVID cases
        - name: total_deaths
          type: sum
          expression: total_deaths
          description: Total cumulative COVID deaths
        - name: total_new_cases
          type: sum
          expression: total_cases_since_prev_day
          description: Total new COVID cases since previous period

- name: sem_nyt_us_covid19
  description: >
