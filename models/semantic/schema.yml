  config:
    meta:
      snowflake_semantic_view:
        name: SEM_NYT_US_COVID19
        description: New York Times US COVID-19 — cumulative and incremental cases and deaths by state and county
        dimensions:
        - name: state
          description: US state name
        - name: county
          description: US county name
        - name: month_period
          description: Month period of the record
        metrics:
        - name: total_cases
          type: sum
          expression: total_cases
          description: Total cumulative COVID cases
        - name: total_deaths
          type: sum
          expression: total_deaths
          description: Total cumulative COVID deaths
        - name: total_new_cases
          type: sum
          expression: total_cases_since_prev_day
          description: Total new cases since previous period

- name: sem_apple_mobility
  description: >
    Semantic view for Apple Maps mobility. Grain: (province_state, transportation_type, month_period).
    DDL: ddl/semantic/sem_apple_mobility_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_APPLE_MOBILITY
        description: Apple Maps mobility — % change in routing requests by transport type (driving, walking, transit) by region and month
        dimensions:
        - name: province_state
          description: Province or state name
        - name: transportation_type
          description: Type of transportation (driving, walking, transit)
        - name: iso3166_1
          description: ISO 3166-1 country code
        - name: month_period
          description: Month period of the mobility record
        metrics:
        - name: avg_mobility_change
          type: avg
          expression: avg_difference
          description: Average mobility change percentage vs baseline

- name: sem_product_performance
  description: >
    Semantic view for e-commerce product performance. Grain: (site, brand, main_category, period_date).
    DDL: ddl/semantic/sem_product_performance_ddl.sql
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_PRODUCT_PERFORMANCE
        description: E-commerce product performance — views, purchases, and conversion rates by site, brand, category, and time
        dimensions:
        - name: site
          description: E-commerce site name
        - name: site_segment
          description: Segment of the site
        - name: brand
          description: Product brand
        - name: main_category
          description: Primary product category
        - name: sub_category
          description: Secondary product sub-category
        - name: period_date
          description: Date of the performance record
        - name: period_month
          description: Month derived from period_date
        - name: period_year
          description: Year derived from period_date
        metrics:
        - name: total_views
          type: sum
          expression: total_views
          description: Total product page views
        - name: total_purchases
          type: sum
          expression: total_purchases
          description: Total purchases
        - name: avg_conversion_rate
          type: avg
          expression: conversion_rate
          description: Average conversion rate

- name: sem_sales_analysis
  description: Semantic view base model for sales analysis. Auto-generated.
  config:
    meta:
      snowflake_semantic_view:
        name: SEM_SALES_ANALYSIS
        description: Sales Analysis semantic view
        dimensions:
        - name: sales_date
          description: Sales date
        - name: item_category
          description: Item category
        metrics:
        - name: total_sales
          type: SUM
          expression: total_sales
          description: Total sales
        - name: total_average_price
          type: SUM
          expression: average_price
          description: Average price
        - name: total_transaction_count
          type: SUM
          expression: transaction_count
          description: Transaction count
