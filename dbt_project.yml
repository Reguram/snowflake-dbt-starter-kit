name: 'snowflake_dbt_starter_kit'
version: '1.0.0'
config-version: 2

profile: 'snowflake_dbt_starter_kit'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  source_database: "COVID19_EPIDEMIOLOGICAL_DATA"
  source_schema: "PUBLIC"

models:
  snowflake_dbt_starter_kit:
    staging:
      +materialized: view
      +schema: DBT_STAGING
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: DBT_INTERMEDIATE
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: DBT_MARTS
      +tags: ["marts"]
    semantic:
      +enabled: false
      +schema: SEMANTIC
      +tags: ["semantic"]
      # Semantic models are disabled from dbt build.
      # The Snowflake Semantic View DDL is maintained in ddl/semantic/
      # and executed directly in Snowflake.
      # To re-enable for testing: dbt build --select tag:semantic --vars '{semantic_enabled: true}'

seeds:
  snowflake_dbt_starter_kit:
    +schema: seeds

snapshots:
  snowflake_dbt_starter_kit:
    +target_schema: snapshots
    +strategy: timestamp
