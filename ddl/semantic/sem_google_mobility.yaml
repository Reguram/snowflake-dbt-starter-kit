# Snowflake Semantic View YAML Specification for Google Global Mobility Report
# Use with: CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);
#
# To validate without creating:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$, TRUE);
# To create:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);

name: SEM_GOOGLE_MOBILITY
description: Google global mobility report — percentage change in visits to places by category (retail, parks, transit, workplaces, residential) by region and month

tables:
  - name: MOBILITY
    description: Google mobility report aggregated by region, sub-region, and month
    base_table:
      database: DBT_DEV
      schema: DBT_MARTS
      table: SUMMARY_GOOG_GLOBAL_MOBILITY_REPORT
    dimensions:
      - name: PROVINCE_STATE
        description: Province or state name
        expr: province_state
        data_type: VARCHAR
      - name: ISO_3166_1
        description: ISO 3166-1 country code
        expr: iso_3166_1
        data_type: VARCHAR
      - name: ISO_3166_2
        description: ISO 3166-2 state/region code
        expr: iso_3166_2
        data_type: VARCHAR
      - name: SUB_REGION_2
        description: Sub-region level 2 (e.g., county)
        expr: sub_region_2
        data_type: VARCHAR
      - name: LAST_REPORTED_FLAG
        description: True if this is the most recent record for this region
        expr: last_reported_flag
        data_type: BOOLEAN
      - name: MONTH_PERIOD
        description: Month period of the mobility record
        expr: month_period
        data_type: DATE
      - name: YEAR_PERIOD
        description: Year period of the mobility record
        expr: year_period
        data_type: "NUMBER(4,0)"
    metrics:
      - name: AVG_GROCERY_PHARMACY_CHANGE
        description: Average % change in visits to grocery stores and pharmacies vs baseline
        expr: AVG(avg_grocery_and_pharmacy_change_perc)
      - name: AVG_PARKS_CHANGE
        description: Average % change in visits to parks vs baseline
        expr: AVG(avg_parks_change_perc)
      - name: AVG_RESIDENTIAL_CHANGE
        description: Average % change in time spent at residential locations vs baseline
        expr: AVG(avg_residential_change_perc)
      - name: AVG_RETAIL_RECREATION_CHANGE
        description: Average % change in visits to retail and recreation vs baseline
        expr: AVG(avg_retail_and_recreation_change_perc)
      - name: AVG_TRANSIT_STATIONS_CHANGE
        description: Average % change in visits to transit stations vs baseline
        expr: AVG(avg_transit_stations_change_perc)
      - name: AVG_WORKPLACES_CHANGE
        description: Average % change in visits to workplaces vs baseline
        expr: AVG(avg_workplaces_change_perc)
      - name: TOTAL_RECORDS
        description: Total number of reporting records
        expr: SUM(record_count)
