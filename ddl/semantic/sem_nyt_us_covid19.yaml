# Snowflake Semantic View YAML Specification for NYT US COVID-19
# Use with: CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);
#
# To validate without creating:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$, TRUE);
# To create:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);

name: SEM_NYT_US_COVID19
description: New York Times US COVID-19 data — cumulative and incremental cases and deaths by US state and county over time

tables:
  - name: NYT
    description: NYT US COVID-19 summary aggregated by state, county, and month
    base_table:
      database: DBT_DEV
      schema: DBT_MARTS
      table: SUMMARY_NYT_US_COVID19
    dimensions:
      - name: STATE
        description: US state name
        expr: state
        data_type: VARCHAR
      - name: COUNTY
        description: US county name
        expr: county
        data_type: VARCHAR
      - name: FIPS
        description: FIPS geographic code
        expr: fips
        data_type: VARCHAR
      - name: ISO3166_1
        description: ISO 3166-1 country code
        expr: iso3166_1
        data_type: VARCHAR
      - name: ISO3166_2
        description: ISO 3166-2 state code
        expr: iso3166_2
        data_type: VARCHAR
      - name: LAST_REPORTED_FLAG
        description: True if this is the most recent record for this location
        expr: last_reported_flag
        data_type: BOOLEAN
      - name: MONTH_PERIOD
        description: Month period of the record
        expr: month_period
        data_type: DATE
      - name: YEAR_PERIOD
        description: Year period of the record
        expr: year_period
        data_type: "NUMBER(4,0)"
    metrics:
      - name: TOTAL_CASES
        description: Total cumulative COVID cases
        expr: SUM(total_cases)
      - name: TOTAL_DEATHS
        description: Total cumulative COVID deaths
        expr: SUM(total_deaths)
      - name: TOTAL_NEW_CASES
        description: Total new COVID cases since previous reporting period
        expr: SUM(total_cases_since_prev_day)
      - name: TOTAL_NEW_DEATHS
        description: Total new COVID deaths since previous reporting period
        expr: SUM(total_deaths_since_prev_day)
      - name: AVG_CASES
        description: Average cases per reporting period
        expr: AVG(avg_cases)
      - name: AVG_DEATHS
        description: Average deaths per reporting period
        expr: AVG(avg_deaths)
      - name: TOTAL_RECORDS
        description: Total number of reporting records
        expr: SUM(record_count)
