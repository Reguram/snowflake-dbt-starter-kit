# Snowflake Semantic View YAML Specification for JHU COVID-19 Timeseries
# Use with: CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);
#
# To validate without creating:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$, TRUE);
# To create:
#   CALL SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML('DBT_DEV.SEMANTIC', $$<yaml>$$);

name: SEM_JHU_COVID19_TIMESERIES
description: JHU COVID-19 timeseries — cumulative and incremental case counts by country, state, county, and case type over time

tables:
  - name: JHU_TS
    description: JHU COVID-19 timeseries summary aggregated by location, case type, and month
    base_table:
      database: DBT_DEV
      schema: DBT_MARTS
      table: SUMMARY_JHU_COVID_19_TIMESERIES
    dimensions:
      - name: PROVINCE_STATE
        description: Province or state name
        expr: province_state
        data_type: VARCHAR
      - name: COUNTY
        description: County name
        expr: county
        data_type: VARCHAR
      - name: FIPS
        description: FIPS geographic code
        expr: fips
        data_type: VARCHAR
      - name: ISO3166_1
        description: ISO 3166-1 country code
        expr: iso3166_1
        data_type: VARCHAR
      - name: ISO3166_2
        description: ISO 3166-2 state/region code
        expr: iso3166_2
        data_type: VARCHAR
      - name: CASE_TYPE
        description: Type of COVID case (Confirmed, Deaths, etc.)
        expr: case_type
        data_type: VARCHAR
      - name: LAST_REPORTED_FLAG
        description: True if this is the most recent record for this location
        expr: last_reported_flag
        data_type: BOOLEAN
      - name: MONTH_PERIOD
        description: Month period of the record
        expr: month_period
        data_type: DATE
      - name: YEAR_PERIOD
        description: Year period of the record
        expr: year_period
        data_type: "NUMBER(4,0)"
    metrics:
      - name: TOTAL_CASES
        description: Total cumulative COVID cases
        expr: SUM(total_cases)
      - name: TOTAL_NEW_CASES
        description: Total new cases (difference from previous period)
        expr: SUM(total_difference)
      - name: AVG_CASES
        description: Average cases per reporting period
        expr: AVG(avg_cases)
      - name: MAX_CASES
        description: Maximum cases recorded in a single period
        expr: MAX(max_cases)
      - name: TOTAL_RECORDS
        description: Total number of reporting records
        expr: SUM(record_count)
