name: SEM_ECDC_GLOBAL
tables:
  - name: SUMMARY_ECDC_GLOBAL
    description: |-
      European Centre for Disease Prevention and Control (ECDC) global COVID-19 data showing cumulative and daily cases, deaths, and population by country and continent.
      
      This dataset provides a worldwide view of the COVID-19 pandemic as reported by ECDC. Data is aggregated by country (with continent grouping) and month period, enabling analysis of pandemic trends across geographies.
      
      Key features:
      - Country-level data with continent grouping
      - ISO 3166-1 geographic codes for standardized country identification
      - Cumulative and incremental (new) case and death counts
      - Population data for per-capita analysis
      - Monthly aggregation for trend analysis
      - Last reported flag for identifying the most current data point
    base_table:
      database: DBT_DEV
      schema: DBT_MARTS
      table: SUMMARY_ECDC_GLOBAL
    dimensions:
      - name: CONTINENTEXP
        synonyms:
          - continent
          - region
        description: Continent name
        expr: CONTINENTEXP
        data_type: VARCHAR
        sample_values:
          - 'Europe'
          - 'Asia'
          - 'America'
      - name: ISO3166_1
        synonyms:
          - country code
          - ISO country
        description: ISO 3166-1 country code
        expr: ISO3166_1
        data_type: VARCHAR
        sample_values:
          - 'US'
          - 'GB'
          - 'IN'
      - name: LAST_REPORTED_FLAG
        description: True if this is the most recent record for this country
        expr: LAST_REPORTED_FLAG
        data_type: BOOLEAN
        sample_values:
          - 'true'
          - 'false'
      - name: MONTH_PERIOD
        synonyms:
          - month
          - reporting month
        description: Month period of the record
        expr: MONTH_PERIOD
        data_type: DATE
        sample_values:
          - '2020-03-01'
          - '2021-01-01'
          - '2022-06-01'
      - name: YEAR_PERIOD
        synonyms:
          - year
          - reporting year
        description: Year period of the record
        expr: YEAR_PERIOD
        data_type: NUMBER(4,0)
        sample_values:
          - '2020'
          - '2021'
          - '2022'
    facts:
      - name: TOTAL_CASES
        synonyms:
          - cumulative cases
          - total COVID cases
        description: Total cumulative COVID cases
        expr: TOTAL_CASES
        data_type: NUMBER(18,0)
        default_aggregation: sum
        sample_values:
          - '50000'
          - '1200000'
          - '350000'
      - name: TOTAL_DEATHS
        synonyms:
          - cumulative deaths
          - total COVID deaths
        description: Total cumulative COVID deaths
        expr: TOTAL_DEATHS
        data_type: NUMBER(18,0)
        default_aggregation: sum
        sample_values:
          - '1200'
          - '25000'
          - '8000'
      - name: TOTAL_CASES_SINCE_PREV_DAY
        synonyms:
          - new cases
          - daily new cases
          - incremental cases
        description: Total new COVID cases since previous day/period
        expr: TOTAL_CASES_SINCE_PREV_DAY
        data_type: NUMBER(18,0)
        default_aggregation: sum
        sample_values:
          - '5000'
          - '50000'
          - '15000'
      - name: TOTAL_DEATHS_SINCE_PREV_DAY
        synonyms:
          - new deaths
          - daily new deaths
          - incremental deaths
        description: Total new COVID deaths since previous day/period
        expr: TOTAL_DEATHS_SINCE_PREV_DAY
        data_type: NUMBER(18,0)
        default_aggregation: sum
        sample_values:
          - '100'
          - '1500'
          - '400'
      - name: AVG_CASES
        synonyms:
          - average cases
          - mean cases per period
        description: Average cases per reporting period
        expr: AVG_CASES
        data_type: NUMBER(18,2)
        default_aggregation: avg
        sample_values:
          - '1500.50'
          - '35000.00'
          - '10000.25'
      - name: AVG_DEATHS
        synonyms:
          - average deaths
          - mean deaths per period
        description: Average deaths per reporting period
        expr: AVG_DEATHS
        data_type: NUMBER(18,2)
        default_aggregation: avg
        sample_values:
          - '35.50'
          - '800.00'
          - '250.25'
      - name: AVG_POPULATION
        synonyms:
          - population
          - country population
        description: Average population of reporting countries
        expr: AVG_POPULATION
        data_type: NUMBER(18,0)
        default_aggregation: avg
        sample_values:
          - '331000000'
          - '67000000'
          - '1380000000'
      - name: RECORD_COUNT
        synonyms:
          - number of records
          - total records
        description: Total number of reporting records in the aggregation
        expr: RECORD_COUNT
        data_type: NUMBER(18,0)
        default_aggregation: sum
        sample_values:
          - '30'
          - '120'
          - '365'
